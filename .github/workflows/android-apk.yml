name: Empire E-Story Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences and install platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Python application syntax
        run: python -m py_compile app.py empire_store.py wsgi.py

      - name: Build automatically signed release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature and checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-estory-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-v4
          name: Empire E-Story 1.2.0
          target_commitish: main
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            Empire E-Story Android release 1.2.0.
            Automatically signed using the Android Gradle debug signing key.
            This build may require uninstalling a differently signed previous app before installation.
