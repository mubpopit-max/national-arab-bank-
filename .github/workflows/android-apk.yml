name: Empire E-Story Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate and decode release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/empire-estory-release.jks"
          test -s "$RUNNER_TEMP/signing/empire-estory-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/signing/empire-estory-release.jks" -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/signing/keystore-check.txt" 2>&1; then
            echo "Keystore could not be opened. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            cat "$RUNNER_TEMP/signing/keystore-check.txt"
            exit 1
          fi
          if ! grep -Fq "$KEY_ALIAS" "$RUNNER_TEMP/signing/keystore-check.txt"; then
            echo "The configured ANDROID_KEY_ALIAS was not found. Available aliases:"
            cat "$RUNNER_TEMP/signing/keystore-check.txt"
            exit 1
          fi
          echo "Release keystore and alias validated."
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/empire-estory-release.jks" >> "$GITHUB_ENV"

      - name: Accept Android SDK licences and install platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Python application syntax
        run: python -m py_compile app.py empire_store.py wsgi.py

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature and checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-estory-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish mandatory update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-v4
          name: Empire E-Story 1.2.0
          target_commitish: main
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            Empire E-Story Android release 1.2.0.
            Signed with the project's persistent release keystore.
            This release is the mandatory in-app update target.
