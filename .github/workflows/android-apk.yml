name: Empire E-Story Android APK

on:
  push:
    branches: [main, android-app-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences and install platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Python application syntax
        run: python -m py_compile app.py empire_store.py

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Calculate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-estory-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish browser-downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: Empire E-Story Android APK (Test)
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Installable Android test build of Empire E-Story.
            This app loads the hosted Faable website and requires an internet connection.
            Debug-signed test build; not the final Google Play release.
