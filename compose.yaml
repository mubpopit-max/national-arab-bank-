services:
  empire-estory:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - empire_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/store/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  empire_data:
