plugins {
    id "com.android.application"
}

android {
    namespace "com.empire.estory"
    compileSdk 35

    defaultConfig {
        applicationId "com.empire.estory"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            def signingPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (signingPath == null || signingPath.trim().isEmpty()) {
                throw new GradleException("ANDROID_KEYSTORE_PATH is required for release builds")
            }
            storeFile file(signingPath)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}
