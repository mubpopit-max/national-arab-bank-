plugins {
    id "com.android.application"
}

android {
    namespace "com.empire.estory"
    compileSdk 35

    defaultConfig {
        applicationId "com.empire.estory"
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName "1.3.2"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}
