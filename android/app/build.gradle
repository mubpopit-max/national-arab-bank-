plugins {
    id "com.android.application"
}

android {
    namespace "com.empire.estory"
    compileSdk 35

    defaultConfig {
        applicationId "com.empire.estory"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}
